# E2: the interval trade-off. EVBLB (B2/B3) with every dispatch interval at low and high load.
name: e2
methods:
  - {name: evblb, dt: 0.25}
  - {name: evblb, dt: 0.5}
  - {name: evblb, dt: 1.0}
  - {name: evblb, dt: 2.0}
  - {name: evblb, dt: 4.0}
grid:
  workload: [W1]
  rho: [0.5, 0.9]
  n: [50]
  seed: [100, 101, 102, 103, 104]
