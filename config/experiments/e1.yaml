# E1: does our simulator reproduce EVBLB's basic behaviour?
# Nearest-only (B1) vs EVBLB with dt = 2 s (B2) on stationary traffic, for several sizes.
name: e1
methods:
  - {name: nearest}
  - {name: evblb, dt: 2.0}
grid:
  workload: [W1]
  rho: [0.7]
  n: [10, 25, 50, 100]
  seed: [100, 101, 102, 103, 104]
